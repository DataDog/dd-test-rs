[package]
name = "dd-test-wrapper"
description = "rustc workspace wrapper that injects the Datadog test harness into test builds, and the agent the harness talks to"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
dd-test-agent = { path = "../dd-test-agent", version = "0.1.0" }

[dev-dependencies]
serde_json = "1"
flate2 = "1"
rmp-serde = "1.3"
