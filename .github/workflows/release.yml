name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (vMAJOR.MINOR.PATCH, for example v0.1.0). It must match the workspace version."
        required: true
        type: string
  # Builds and packages the release files, without releasing, when the release process changes.
  pull_request:
    paths:
      - .github/workflows/release.yml
      - .github/scripts/package.sh
      - .github/scripts/release.sh
      - about.toml
      - about.hbs

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  authorize:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # dd-octo-sts exchanges the OIDC token for a token that can create releases
    env:
      VERSION: ${{ inputs.version }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Get GitHub token
        uses: DataDog/dd-octo-sts-action@c85802a58e202b7e764b5441e4378c76043c8108 # v1.0.5
        id: octo-sts
        with:
          scope: DataDog/dd-test-rs
          policy: self.github.release.main
      - name: Validate release request
        env:
          GH_TOKEN: ${{ steps.octo-sts.outputs.token }}
        run: bash .github/scripts/release.sh validate

  build:
    needs: authorize
    if: ${{ !failure() && !cancelled() }}
    name: build (${{ matrix.asset }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
            asset: dd-test-wrapper-linux-amd64
            smoke: true
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
            asset: dd-test-wrapper-linux-arm64
            smoke: true
          - target: x86_64-apple-darwin
            runner: macos-15
            asset: dd-test-wrapper-darwin-amd64
            smoke: false
          - target: aarch64-apple-darwin
            runner: macos-15
            asset: dd-test-wrapper-darwin-arm64
            smoke: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal --target "$TARGET" --no-self-update
        env:
          TARGET: ${{ matrix.target }}
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build
        env:
          TARGET: ${{ matrix.target }}
          CARGO_PROFILE_RELEASE_STRIP: symbols
        run: |
          if [[ "$TARGET" == *-linux-musl ]]; then
            export "CC_${TARGET//-/_}=musl-gcc"
          fi
          cargo +stable build --release --locked -p dd-test-wrapper --target "$TARGET"
      # The wrapper must inject the harness: without an API key, the test binary warns that it does not report.
      - name: Smoke test
        if: matrix.smoke
        env:
          RUSTC_WORKSPACE_WRAPPER: ${{ github.workspace }}/target/${{ matrix.target }}/release/dd-test-wrapper
        working-directory: fixtures/basic
        run: |
          set -o pipefail
          cargo +stable test --test integration adds 2>&1 | tee "$RUNNER_TEMP/smoke.log"
          grep -F "tests are not reported to Datadog: DD_API_KEY is not set" "$RUNNER_TEMP/smoke.log"
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-about@0.9.3
      - name: Package
        env:
          TARGET: ${{ matrix.target }}
          ASSET: ${{ matrix.asset }}
        run: bash .github/scripts/package.sh "$TARGET" "$ASSET" dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}.tar.gz
          if-no-files-found: error

  release:
    needs: [authorize, build]
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # dd-octo-sts exchanges the OIDC token for a token that can create releases
    env:
      VERSION: ${{ inputs.version }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: |
          sha256sum dd-test-wrapper-*.tar.gz > SHA256SUMS
          cat SHA256SUMS
      - name: Get GitHub token
        uses: DataDog/dd-octo-sts-action@c85802a58e202b7e764b5441e4378c76043c8108 # v1.0.5
        id: octo-sts
        with:
          scope: DataDog/dd-test-rs
          policy: self.github.release.main
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ steps.octo-sts.outputs.token }}
        run: bash .github/scripts/release.sh create
